[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts = 
    --reuse-db
    --tb=short
    -v
filterwarnings =
    ignore::DeprecationWarning:gqlauth.*
    ignore::DeprecationWarning:strawberry.*
    ignore::DeprecationWarning:functools.*
# App directories, NOT their `tests/` subdirectories. Listing `<app>/tests`
# silently skipped every test file sitting directly in an app dir — that hid
# recaps/tests.py, recaps/test_pdf.py and recaps/test_campaign_pdf.py from CI
# for long enough that they rotted through three intentional API changes
# (Relay global IDs, #666 filer-scoped mail, #708 tenant scoping) while
# develop stayed green. digest/, utils/ and wingspan/ were missing outright.
testpaths =
    academy
    ambassadors
    announcements
    chats
    digest
    events
    jobs
    recaps
    receipts
    tenants
    utils
    wingspan

