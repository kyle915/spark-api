name: Setup job board (manual)

# Manually fires `/internal/cron/setup-job-board` on Cloud Run to run
# `setup_job_board`: mints (once) the brand's public BA job board link
# (`client.igniteproductions.co/jobs/<token>`) and lists the plan gigs it
# shows. An existing board token is kept (never re-minted).
#
# DRY-RUN unless `apply` is checked. Secret-gated via X-Cron-Secret (shared
# INTERNAL_CRON_SECRET) — a HEADER, never the URL.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write (unchecked = dry run)."
        required: false
        default: false
        type: boolean
      tenant:
        description: "Tenant slug (exact), else request_url_name."
        required: false
        default: "torch-thc"
        type: string
      post_waiting:
        description: "Also approve + create events for waiting plans so they list (no emails)."
        required: false
        default: false
        type: boolean

jobs:
  fire-setup-job-board:
    runs-on: ubuntu-latest
    steps:
      - name: Fire setup-job-board cron endpoint
        env:
          CRON_URL: https://spark-api-new-490085168610.us-central1.run.app/internal/cron/setup-job-board
          CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
          APPLY: ${{ github.event.inputs.apply }}
          TENANT: ${{ github.event.inputs.tenant || 'torch-thc' }}
          POST_WAITING: ${{ github.event.inputs.post_waiting }}
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::INTERNAL_CRON_SECRET is not set in repo secrets."
            exit 1
          fi
          STATUS=$(curl -sS -o /tmp/cron-response.json -w '%{http_code}' \
            --max-time 120 \
            -X POST "$CRON_URL" \
            --data-urlencode "tenant=$TENANT" \
            --data-urlencode "apply=$APPLY" \
            --data-urlencode "post_waiting=$POST_WAITING" \
            -H "X-Cron-Secret: $CRON_SECRET")
          echo "HTTP $STATUS"
          python3 -c "import json; d=json.load(open('/tmp/cron-response.json')); print(d.get('log') or d); print(d.get('detail') or '')"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Cron endpoint returned $STATUS — see body above."
            exit 1
          fi
