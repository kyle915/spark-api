name: Tag Torch dry-demo recaps (manual)

# Manually fires `/internal/cron/tag-torch-dry-demos` on Cloud Run to run
# `tag_torch_dry_demos`: for reviewed recap ids whose own notes say no
# product was tasted, sets Dry demo? = Yes and People engaged = consumers
# sampled. Never changes consumers sampled or any other value. Logs
# before/after per recap. See
# recaps/management/commands/tag_torch_dry_demos.py.
#
# DRY-RUN unless `apply` is checked. Secret-gated via X-Cron-Secret (shared
# INTERNAL_CRON_SECRET) — a HEADER, never the URL.

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Comma-separated CustomRecap ids."
        required: true
        type: string
      apply:
        description: "Write the tags (unchecked = dry run)."
        required: false
        default: false
        type: boolean
      tenant:
        description: "Tenant slug (exact), else request_url_name."
        required: false
        default: "torch-thc"
        type: string

jobs:
  fire-tag-torch-dry-demos:
    runs-on: ubuntu-latest
    steps:
      - name: Fire tag-torch-dry-demos cron endpoint
        env:
          CRON_URL: https://spark-api-new-490085168610.us-central1.run.app/internal/cron/tag-torch-dry-demos
          CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
          IDS: ${{ github.event.inputs.ids }}
          APPLY: ${{ github.event.inputs.apply }}
          TENANT: ${{ github.event.inputs.tenant || 'torch-thc' }}
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::INTERNAL_CRON_SECRET is not set in repo secrets."
            exit 1
          fi
          STATUS=$(curl -sS -o /tmp/cron-response.json -w '%{http_code}' \
            --max-time 300 \
            -X POST "$CRON_URL" \
            --data-urlencode "ids=$IDS" \
            --data-urlencode "tenant=$TENANT" \
            --data-urlencode "apply=$APPLY" \
            -H "X-Cron-Secret: $CRON_SECRET")
          echo "HTTP $STATUS"
          python3 -c "import json; d=json.load(open('/tmp/cron-response.json')); open('/tmp/torch-dry-demo-tagging.txt','w').write(d.get('log') or json.dumps(d)); print(d.get('log') or d); print(d.get('detail') or '')"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Cron endpoint returned $STATUS — see body above."
            exit 1
          fi
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: torch-dry-demo-tagging
          path: /tmp/torch-dry-demo-tagging.txt
          if-no-files-found: ignore
