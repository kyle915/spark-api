name: Setup Neutonic check-in

# Adds Event Activation to Neutonic's existing standing walk-up link:
# selectable event type + LD/MAB activation photo buckets. Preserves the
# existing code and any already-configured programs (Retail Sampling, Event,
# On-Premise Sampling, …). Recap template is seeded separately by
# "Seed Neutonic recap template". Idempotent — never rotates the code.
#
# RUN apply=false FIRST AND READ THE LOG. Then apply=true (LD lesson).

on:
  workflow_dispatch:
    inputs:
      tenant:
        description: "Tenant name/slug substring"
        required: false
        default: "neutonic"
      apply:
        description: "Actually write (read the dry run first)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  setup-neutonic-checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Fire setup-neutonic-checkin cron endpoint
        env:
          CRON_URL: https://spark-api-new-490085168610.us-central1.run.app/internal/cron/setup-neutonic-checkin
          CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
          TENANT: ${{ github.event.inputs.tenant }}
          APPLY: ${{ github.event.inputs.apply }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::INTERNAL_CRON_SECRET is not set in repo secrets."
            exit 1
          fi
          STATUS=$(curl -sS -o /tmp/cron-response.json -w '%{http_code}' \
            -X POST "$CRON_URL" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            --data-urlencode "tenant=$TENANT" \
            --data-urlencode "apply=$APPLY")
          echo "HTTP $STATUS"
          cat /tmp/cron-response.json
          echo ""
          [ "$STATUS" != "200" ] && exit 1 || exit 0
