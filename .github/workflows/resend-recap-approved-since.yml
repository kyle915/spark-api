name: Resend recap-approved client mail

# Fires `/internal/cron/resend-recap-approved-since` — client/RMM
# "Your activation recap is ready" for recaps approved on or after
# --since. Does NOT re-send Ignite internal review/suspect-numbers
# alerts. Dry-run default. Secret-gated. Manual dispatch only.

on:
  workflow_dispatch:
    inputs:
      since:
        description: "Inclusive start date YYYY-MM-DD (America/Los_Angeles)."
        required: true
        default: "2026-07-04"
        type: string
      dry_run:
        description: "Dry run (count recaps + unique To). Set false to send."
        required: true
        default: true
        type: boolean
      html_only:
        description: "Skip PDF attach (link-only HTML, like recap #727)."
        required: true
        default: false
        type: boolean

jobs:
  fire-resend-recap-approved:
    runs-on: ubuntu-latest
    steps:
      - name: Fire resend-recap-approved-since cron endpoint
        env:
          CRON_URL: https://spark-api-new-490085168610.us-central1.run.app/internal/cron/resend-recap-approved-since
          CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          HTML_ONLY: ${{ github.event.inputs.html_only }}
          SINCE: ${{ github.event.inputs.since }}
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::INTERNAL_CRON_SECRET is not set in repo secrets."
            exit 1
          fi
          if [ "$DRY_RUN" = "false" ]; then EXECUTE="true"; else EXECUTE="false"; fi
          echo "since=$SINCE dry_run=$DRY_RUN execute=$EXECUTE html_only=$HTML_ONLY"
          STATUS=$(curl -sS -o /tmp/cron-response.json -w '%{http_code}' \
            -X POST "$CRON_URL" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            --data-urlencode "since=$SINCE" \
            --data-urlencode "execute=$EXECUTE" \
            --data-urlencode "html_only=$HTML_ONLY")
          echo "HTTP $STATUS"
          python3 - <<'PY'
          import json
          raw = open("/tmp/cron-response.json").read()
          try:
              data = json.loads(raw)
          except json.JSONDecodeError:
              print(raw[:2000])
          else:
              print("ok=", data.get("ok"), "execute=", data.get("execute"),
                    "html_only=", data.get("html_only"), "since=", data.get("since"))
              log = data.get("log") or ""
              # Recap ids + recipient counts only — no bodies, no keys.
              print(log)
              if data.get("exception"):
                  print("exception=", data["exception"])
          PY
          [ "$STATUS" != "200" ] && exit 1 || exit 0
