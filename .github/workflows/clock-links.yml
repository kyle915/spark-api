name: Clock links

# Public clock in/out links (`/clock/<token>` on client.igniteproductions.co).
# Fires `/internal/cron/clock-links`, which runs the `clock_links` management
# command (timeclock/management/commands/clock_links.py).
#
# Scheduled: every 15 min, `sync` with apply — rewrites any clock session the
# Google Sheet missed (clock actions never wait on Sheets; this is the retry).
# Manual: list / create / sync / read-sheet / purge-session. Writes are a DRY
# RUN unless `apply` is true. `create` is idempotent on the exact label.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "What to run"
        required: true
        default: "list"
        type: choice
        options:
          - list
          - create
          - sync
          - read-sheet
          - purge-session
      label:
        description: "Clock link label (create / sync / read-sheet)"
        required: false
        default: ""
      tenant_slug:
        description: "Optional client tenant slug (create)"
        required: false
        default: ""
      sheet_url:
        description: "Existing Sheet URL shared with the service account (create; blank = make a new Sheet)"
        required: false
        default: ""
      share_with:
        description: "Comma-separated emails to share a NEW Sheet with as Editor"
        required: false
        default: "kyle@igniteproductions.co"
      session_uuid:
        description: "Session to delete (purge-session)"
        required: false
        default: ""
      rows:
        description: "Rows to print (read-sheet)"
        required: false
        default: "20"
      apply:
        description: "Write changes (otherwise dry run)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  clock-links:
    runs-on: ubuntu-latest
    steps:
      - name: Fire clock-links endpoint
        env:
          CRON_URL: https://spark-api-new-490085168610.us-central1.run.app/internal/cron/clock-links
          CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
          ACTION: ${{ github.event_name == 'schedule' && 'sync' || github.event.inputs.action }}
          APPLY: ${{ github.event_name == 'schedule' && 'true' || github.event.inputs.apply }}
          LABEL: ${{ github.event.inputs.label }}
          TENANT_SLUG: ${{ github.event.inputs.tenant_slug }}
          SHEET_URL: ${{ github.event.inputs.sheet_url }}
          SHARE_WITH: ${{ github.event.inputs.share_with }}
          SESSION_UUID: ${{ github.event.inputs.session_uuid }}
          ROWS: ${{ github.event.inputs.rows }}
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::INTERNAL_CRON_SECRET is not set in repo secrets."
            exit 1
          fi
          STATUS=$(curl -sS -o /tmp/cron-response.json -w '%{http_code}' \
            -X POST "$CRON_URL" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            --data-urlencode "action=$ACTION" \
            --data-urlencode "apply=$APPLY" \
            --data-urlencode "label=$LABEL" \
            --data-urlencode "tenant_slug=$TENANT_SLUG" \
            --data-urlencode "sheet_url=$SHEET_URL" \
            --data-urlencode "share_with=$SHARE_WITH" \
            --data-urlencode "session_uuid=$SESSION_UUID" \
            --data-urlencode "rows=$ROWS")
          echo "HTTP $STATUS"
          python3 -c 'import json; d=json.load(open("/tmp/cron-response.json")); print(d.get("log","")); [print(k, "=", v) for k, v in d.items() if k != "log"]'
          [ "$STATUS" = "200" ]
