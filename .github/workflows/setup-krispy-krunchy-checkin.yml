name: Setup Krispy Krunchy Chicken check-in

# Seeds the "Krispy Krunchy Chicken · Field Sampling Recap" template (PDF
# minus City / Sampling Location #1 / sample time), creates the tenant if
# missing, and mints the standing KKC- check-in code. Idempotent.
#
# RUN apply=false FIRST AND READ THE LOG.

on:
  workflow_dispatch:
    inputs:
      tenant:
        description: "Tenant name/slug substring"
        required: false
        default: "krispy"
      template_name:
        description: "Template name (blank = the default)"
        required: false
        default: ""
      event_type:
        description: "Event type substring (blank = prefer 'sampling')"
        required: false
        default: ""
      prefix:
        description: "Brand prefix for a NEW code. Blank = KKC-"
        required: false
        default: ""
      apply:
        description: "Actually write (read the dry run first)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  setup-krispy-krunchy-checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Fire setup endpoint
        env:
          CRON_URL: https://spark-api-new-490085168610.us-central1.run.app/internal/cron/setup-krispy-krunchy-checkin
          CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
          TENANT: ${{ github.event.inputs.tenant }}
          TEMPLATE_NAME: ${{ github.event.inputs.template_name }}
          EVENT_TYPE: ${{ github.event.inputs.event_type }}
          PREFIX: ${{ github.event.inputs.prefix }}
          APPLY: ${{ github.event.inputs.apply }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::INTERNAL_CRON_SECRET is not set in repo secrets."
            exit 1
          fi
          STATUS=$(curl -sS -o /tmp/cron-response.json -w '%{http_code}' \
            -X POST "$CRON_URL" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            --data-urlencode "tenant=$TENANT" \
            --data-urlencode "template_name=$TEMPLATE_NAME" \
            --data-urlencode "event_type=$EVENT_TYPE" \
            --data-urlencode "prefix=$PREFIX" \
            --data-urlencode "apply=$APPLY")
          echo "HTTP $STATUS"
          cat /tmp/cron-response.json
          echo ""
          [ "$STATUS" != "200" ] && exit 1 || exit 0
