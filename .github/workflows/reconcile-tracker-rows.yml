name: Reconcile tracker rows

# Self-healing sweep: mirrors any request whose tracker row never landed.
# Mirroring is best-effort and fails silently (upsert_request_row swallows, the
# post_save signal swallows, and the explicit re-syncs are gated on `if
# _routed:` so unrouted requests get no second attempt). This converges the
# tracker regardless of which path dropped the row.
#
# Safe to run unattended: ADDITIVE ONLY (never rewrites an existing keyed row,
# which matters because some rows are correct while the request's current
# timezone would render them wrong), skips rows the client hand-typed so live
# activations aren't duplicated, and windowed to -14d..+120d.
#
# The SCHEDULE runs with apply=true so it actually heals. Manual dispatch
# defaults to apply=false so you can look before it writes.

on:
  schedule:
    # every 30 minutes — a dropped row is visible to the client fast
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      tenant_slug:
        description: "Limit to one tenant slug (blank = all linked sheets)"
        required: false
        default: ""
      days_back:
        description: "How far back to look"
        required: false
        default: "14"
      days_ahead:
        description: "How far ahead to look"
        required: false
        default: "120"
      apply:
        description: "Actually write the missing rows"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  reconcile-tracker-rows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fire reconcile endpoint
        env:
          CRON_URL: https://spark-api-new-490085168610.us-central1.run.app/internal/cron/reconcile-tracker-rows
          CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
          TENANT_SLUG: ${{ github.event.inputs.tenant_slug }}
          DAYS_BACK: ${{ github.event.inputs.days_back }}
          DAYS_AHEAD: ${{ github.event.inputs.days_ahead }}
          # Gate on the EVENT, not on an empty input. `inputs.apply || 'true'`
          # made a manual dispatch with a blank input silently WRITE, which is
          # the opposite of safe-by-default and did fire once by accident.
          # schedule -> always apply; dispatch -> exactly what was passed.
          APPLY: ${{ github.event_name == 'schedule' && 'true' || github.event.inputs.apply }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::INTERNAL_CRON_SECRET is not set in repo secrets."
            exit 1
          fi
          STATUS=$(curl -sS -o /tmp/cron-response.json -w '%{http_code}' \
            -X POST "$CRON_URL" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            --data-urlencode "tenant_slug=$TENANT_SLUG" \
            --data-urlencode "days_back=$DAYS_BACK" \
            --data-urlencode "days_ahead=$DAYS_AHEAD" \
            --data-urlencode "apply=$APPLY" \
            --max-time 540)
          echo "HTTP $STATUS"
          cat /tmp/cron-response.json
          echo ""
          [ "$STATUS" != "200" ] && exit 1 || exit 0

      - name: Upload full report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracker-reconcile
          path: /tmp/cron-response.json
          retention-days: 3
