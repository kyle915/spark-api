name: Onboard Brew Dr products

# Seeds Brew Dr. Kombucha Product catalog (Kombucha + 6 SKUs), retires extras,
# refreshes Products Sampled options, and rewrites recaps that lack the new set.
# Idempotent. Dry-run by default; flip apply=true to write.

on:
  workflow_dispatch:
    inputs:
      owner_email:
        description: "Owner email for created_by"
        required: true
        default: "kyle@igniteproductions.co"
      tenant:
        description: "Tenant name/slug substring"
        required: false
        default: "brew"
      apply:
        description: "Actually write (true) or dry-run (false)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      skip_migrate:
        description: "Skip recap Products Sampled rewrite"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  onboard-brew-dr-products:
    runs-on: ubuntu-latest
    steps:
      - name: Fire onboard-brew-dr-products cron endpoint
        env:
          CRON_URL: https://spark-api-new-490085168610.us-central1.run.app/internal/cron/onboard-brew-dr-products
          CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
          OWNER_EMAIL: ${{ github.event.inputs.owner_email }}
          TENANT: ${{ github.event.inputs.tenant }}
          APPLY: ${{ github.event.inputs.apply }}
          SKIP_MIGRATE: ${{ github.event.inputs.skip_migrate }}
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::INTERNAL_CRON_SECRET is not set in repo secrets."
            exit 1
          fi
          STATUS=$(curl -sS -o /tmp/cron-response.json -w '%{http_code}' \
            -X POST "$CRON_URL" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            --data-urlencode "owner_email=$OWNER_EMAIL" \
            --data-urlencode "tenant=$TENANT" \
            --data-urlencode "apply=$APPLY" \
            --data-urlencode "skip_migrate=$SKIP_MIGRATE")
          echo "HTTP $STATUS"
          cat /tmp/cron-response.json
          echo ""
          if [ "$STATUS" != "200" ]; then
            echo "::error::Cron endpoint returned $STATUS — see body above."
            exit 1
          fi
