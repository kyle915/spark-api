name: Build consumer feedback themes ahead of time
on:
  schedule:
    - cron: "50 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be built, but call no model and store nothing"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      tenant:
        description: "Tenant id (blank = every brand with recent approved recaps)"
        required: false
        default: ""
jobs:
  fire-prebuild-feedback-themes:
    runs-on: ubuntu-latest
    steps:
      - name: Fire feedback themes cron endpoint
        env:
          CRON_URL: https://spark-api-new-490085168610.us-central1.run.app/internal/cron/prebuild-feedback-themes
          CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          TENANT: ${{ github.event.inputs.tenant || '' }}
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::INTERNAL_CRON_SECRET is not set in repo secrets."
            exit 1
          fi
          # Cloud Run cuts a request at 300 s. The command stops starting new
          # date ranges with under 60 s of this budget left, and one range can
          # take a few model calls, so 150 keeps the whole run well inside it.
          STATUS=$(curl -sS --max-time 840 -o /tmp/cron-response.json -w '%{http_code}' -X POST "$CRON_URL?dry_run=$DRY_RUN&tenant=$TENANT&max_seconds=150" -H "X-Cron-Secret: $CRON_SECRET" || true)
          echo "HTTP $STATUS"
          # A 504 / 502 from Cloud Run is an HTML or text page, not JSON. Say
          # so plainly instead of failing on a Python JSONDecodeError.
          python3 - <<'PY'
          import json
          import os
          path = "/tmp/cron-response.json"
          raw = ""
          if os.path.exists(path):
              with open(path, encoding="utf-8", errors="replace") as f:
                  raw = f.read()
          try:
              d = json.loads(raw)
          except ValueError:
              snippet = " ".join(raw.split())[:300] or "(empty body)"
              print(f"The endpoint did not answer with JSON (likely a timeout before the run finished). First part of the reply: {snippet}")
          else:
              print(d.get("log") or d)
          PY
          if [ "$STATUS" != "200" ]; then
            if [ "$STATUS" = "504" ]; then
              echo "::error::Cron endpoint timed out (HTTP 504): the run took longer than Cloud Run allows. Ranges already built are kept; the next run continues."
            else
              echo "::error::Cron endpoint returned $STATUS"
            fi
            exit 1
          fi
