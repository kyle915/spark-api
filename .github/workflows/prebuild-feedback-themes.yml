name: Build consumer feedback themes ahead of time
on:
  schedule:
    - cron: "50 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be built, but call no model and store nothing"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      tenant:
        description: "Tenant id (blank = every brand with recent approved recaps)"
        required: false
        default: ""
jobs:
  fire-prebuild-feedback-themes:
    runs-on: ubuntu-latest
    steps:
      - name: Fire feedback themes cron endpoint
        env:
          CRON_URL: https://spark-api-new-490085168610.us-central1.run.app/internal/cron/prebuild-feedback-themes
          CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          TENANT: ${{ github.event.inputs.tenant || '' }}
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::INTERNAL_CRON_SECRET is not set in repo secrets."
            exit 1
          fi
          STATUS=$(curl -sS --max-time 840 -o /tmp/cron-response.json -w '%{http_code}' -X POST "$CRON_URL?dry_run=$DRY_RUN&tenant=$TENANT&max_seconds=240" -H "X-Cron-Secret: $CRON_SECRET")
          echo "HTTP $STATUS"
          python3 -c "import json;d=json.load(open('/tmp/cron-response.json'));print(d.get('log') or d)"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Cron endpoint returned $STATUS"
            exit 1
          fi
