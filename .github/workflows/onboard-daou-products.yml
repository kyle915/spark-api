name: Onboard DAOU products

# Seeds Treasury Wine Estates / DAOU Discovery Product catalog (4 SKUs).
# Optionally creates the tenant when create_tenant=true. Idempotent.
# Dry-run by default; flip apply=true to write.

on:
  workflow_dispatch:
    inputs:
      owner_email:
        description: "Owner email for created_by"
        required: true
        default: "kyle@igniteproductions.co"
      tenant:
        description: "Tenant name/slug substring"
        required: false
        default: "treasury"
      create_tenant:
        description: "Create Treasury Wine Estates tenant if missing"
        required: false
        default: "true"
        type: choice
        options: ["false", "true"]
      apply:
        description: "Actually write (true) or dry-run (false)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  onboard-daou-products:
    runs-on: ubuntu-latest
    steps:
      - name: Fire onboard-daou-products cron endpoint
        env:
          CRON_URL: https://spark-api-new-490085168610.us-central1.run.app/internal/cron/onboard-daou-products
          CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
          OWNER_EMAIL: ${{ github.event.inputs.owner_email }}
          TENANT: ${{ github.event.inputs.tenant }}
          CREATE_TENANT: ${{ github.event.inputs.create_tenant }}
          APPLY: ${{ github.event.inputs.apply }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::INTERNAL_CRON_SECRET is not set in repo secrets."
            exit 1
          fi
          STATUS=$(curl -sS -o /tmp/cron-response.json -w '%{http_code}' \
            -X POST "$CRON_URL" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            --data-urlencode "owner_email=$OWNER_EMAIL" \
            --data-urlencode "tenant=$TENANT" \
            --data-urlencode "create_tenant=$CREATE_TENANT" \
            --data-urlencode "apply=$APPLY")
          echo "HTTP $STATUS"
          cat /tmp/cron-response.json
          echo ""
          [ "$STATUS" != "200" ] && exit 1 || exit 0
