name: Audit Torch plan buckets

# Manual. Where Torch recaps land on field-marketing plans (Planned vs
# Actual): plan, tactic, contributed vs recap values, and flags. Read-only
# unless apply plus a fix flag: attach_missing links approved recaps to the
# plan that booked their request; fix_event_types sets plan events with no
# recap to the plan's program; attach links named recaps to a plan
# ("custom:1867=REQ-MJM5; custom:1868=REQ-MJM5:clocked_hours+photos") after
# printing their place/notes evidence and the plan's Actuals before/after.
# Never edits a recap.
# See events/management/commands/audit_torch_plan_buckets.py.

on:
  workflow_dispatch:
    inputs:
      since:
        description: "YYYY-MM-DD (blank = first plan)"
        required: false
        default: ""
      attach_missing:
        description: "Link missing recaps to their booked plan"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      fix_event_types:
        description: "Set plan events with no recap to the plan's program"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      attach:
        description: "kind:recap_id=PLAN[:metric+metric]; ... (blank = none)"
        required: false
        default: ""
      apply:
        description: "Write (false = dry run)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  audit-torch-plan-buckets:
    runs-on: ubuntu-latest
    steps:
      - name: Fire audit-torch-plan-buckets cron endpoint
        env:
          CRON_URL: https://spark-api-new-490085168610.us-central1.run.app/internal/cron/audit-torch-plan-buckets
          CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
          SINCE: ${{ github.event.inputs.since || '' }}
          ATTACH_MISSING: ${{ github.event.inputs.attach_missing || 'false' }}
          FIX_EVENT_TYPES: ${{ github.event.inputs.fix_event_types || 'false' }}
          ATTACH: ${{ github.event.inputs.attach || '' }}
          APPLY: ${{ github.event.inputs.apply || 'false' }}
        run: |
          set -euo pipefail

          if [ -z "$CRON_SECRET" ]; then
            echo "::error::INTERNAL_CRON_SECRET is not set in repo secrets."
            exit 1
          fi

          STATUS=$(curl -sS -o /tmp/cron-response.json -w '%{http_code}' \
            --max-time 900 \
            -X POST "$CRON_URL" \
            --data-urlencode "since=$SINCE" \
            --data-urlencode "attach_missing=$ATTACH_MISSING" \
            --data-urlencode "fix_event_types=$FIX_EVENT_TYPES" \
            --data-urlencode "attach=$ATTACH" \
            --data-urlencode "apply=$APPLY" \
            -H "X-Cron-Secret: $CRON_SECRET")

          echo "HTTP $STATUS"
          python3 -c 'import json; d=json.load(open("/tmp/cron-response.json")); print(d.get("log") or d)'
          if [ "$STATUS" != "200" ]; then
            echo "::error::Cron endpoint returned $STATUS — see body above."
            exit 1
          fi
