name: Onboard Long Drink products

# Seeds The Finnish Long Drink ProductType + SKUs on Mark Anthony Brands,
# downloading can artwork into Product.image (Torch-style).
#
# RUN apply=false FIRST AND READ THE LOG.

on:
  workflow_dispatch:
    inputs:
      owner_email:
        description: "Spark admin email that owns the product rows"
        required: true
        default: "kyle@igniteproductions.co"
      tenant:
        description: "Tenant name/slug substring"
        required: false
        default: "mark-anthony-brands"
      skip_images:
        description: "Create rows but skip artwork downloads"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      force_images:
        description: "Re-download artwork even when already set"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      apply:
        description: "Actually write (read the dry run first)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  onboard-long-drink-products:
    runs-on: ubuntu-latest
    steps:
      - name: Fire onboard-long-drink-products cron endpoint
        env:
          CRON_URL: https://spark-api-new-490085168610.us-central1.run.app/internal/cron/onboard-long-drink-products
          CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
          OWNER_EMAIL: ${{ github.event.inputs.owner_email }}
          TENANT: ${{ github.event.inputs.tenant }}
          SKIP_IMAGES: ${{ github.event.inputs.skip_images }}
          FORCE_IMAGES: ${{ github.event.inputs.force_images }}
          APPLY: ${{ github.event.inputs.apply }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::INTERNAL_CRON_SECRET is not set in repo secrets."
            exit 1
          fi
          STATUS=$(curl -sS -o /tmp/cron-response.json -w '%{http_code}' \
            -X POST "$CRON_URL" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            --data-urlencode "owner_email=$OWNER_EMAIL" \
            --data-urlencode "tenant=$TENANT" \
            --data-urlencode "skip_images=$SKIP_IMAGES" \
            --data-urlencode "force_images=$FORCE_IMAGES" \
            --data-urlencode "apply=$APPLY")
          echo "HTTP $STATUS"
          cat /tmp/cron-response.json
          echo ""
          [ "$STATUS" != "200" ] && exit 1 || exit 0
