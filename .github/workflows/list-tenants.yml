name: List tenants (read-only)

# Fires `/internal/cron/list-tenants`. READ-ONLY — answers "does this client
# actually exist?" when someone creates one and can't find it in the UI, which
# looks identical whether the row is missing or merely invisible to them.
#
# Dispatch-only; no schedule.

on:
  workflow_dispatch:
    inputs:
      search:
        description: "Substring to match on name or slug. Blank = list all."
        required: false
        default: ""
        type: string
      verbose:
        description: "Also show creator, request URL name and check-in code."
        required: false
        default: false
        type: boolean

jobs:
  fire-list-tenants:
    runs-on: ubuntu-latest
    steps:
      - name: Fire list-tenants cron endpoint
        env:
          CRON_URL: https://spark-api-new-490085168610.us-central1.run.app/internal/cron/list-tenants
          CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
          SEARCH: ${{ github.event.inputs.search || '' }}
          VERBOSE: ${{ github.event.inputs.verbose }}
        run: |
          set -uo pipefail
          if [ -z "$CRON_SECRET" ]; then echo "::error::secret missing"; exit 1; fi
          QS="verbose=$VERBOSE"
          if [ -n "$SEARCH" ]; then
            QS="$QS&search=$(printf '%s' "$SEARCH" | jq -sRr @uri)"
          fi
          STATUS=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
            -X POST "$CRON_URL?$QS" -H "X-Cron-Secret: $CRON_SECRET" || echo 000)
          echo "HTTP $STATUS"
          python3 -c "import json;print(json.load(open('/tmp/resp.json')).get('output',''))" 2>/dev/null || cat /tmp/resp.json
          case "$STATUS" in 2*) exit 0;; *) echo "::error::returned $STATUS"; exit 1;; esac
