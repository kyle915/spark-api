# One-shot: Famus filed walk-up orphan diagnose via cron HTTP (read-only).
# Requires Cloud Run to have diagnose= support (develop deploy).
name: Diagnose Famus walk-in orphans

on:
  workflow_dispatch:
    inputs:
      days_back:
        description: Lookback window in days
        required: true
        default: "45"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Call cron diagnose
        env:
          CRON_URL: https://spark-api-new-490085168610.us-central1.run.app/internal/cron/link-walkin-recaps-to-requests
          CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
          DAYS_BACK: ${{ github.event.inputs.days_back }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::INTERNAL_CRON_SECRET is not set in repo secrets."
            exit 1
          fi
          STATUS=$(curl -sS -o /tmp/cron-response.json -w '%{http_code}' \
            -X POST \
            "$CRON_URL?tenant_slug=famus-energy&days_back=$DAYS_BACK&apply=false&diagnose=true" \
            -H "X-Cron-Secret: $CRON_SECRET")
          echo "HTTP $STATUS"
          cat /tmp/cron-response.json
          echo
          test "$STATUS" = "200"
