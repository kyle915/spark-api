name: Tests

# PR gate + develop check: the full pytest suite against a disposable
# Postgres. Until now spark-api had NO CI — tests only ran when someone ran
# them locally, which twice let runtime-broken changes reach prod that the
# existing suite would have caught (a management command with a swallowed
# `def handle`, stale IDOR-message assertions). Redis is deliberately absent:
# the queue layer logs-and-falls-back inline, same as prod.

on:
  pull_request:
  push:
    branches: [develop]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shard:
    name: pytest (${{ matrix.shard }}/6)
    # Product suite lives on develop. main's pytest is stale; skip it on
    # PRs that target main so workflow-only / cherry-pick PRs stay green.
    if: github.event_name == 'push' || github.base_ref == 'develop' || startsWith(github.base_ref, 'cursor/')
    runs-on: ubuntu-latest
    # The whole suite took 50-65 minutes in one job, which made every ship
    # wait an hour. It is split by test file into six jobs that run at the
    # same time, each with its own Postgres, so a run takes about as long
    # as its slowest sixth.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spark_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/spark_tests
      # Also set DATABASE_URL directly: pytest-django touches settings before
      # the root conftest can map TEST_DATABASE_URL onto it, and settings
      # requires DATABASE_URL at import time.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/spark_tests
      # Throwaway values — settings requires these with no default; nothing
      # in the test run talks to real services.
      SECRET_KEY: ci-only-not-a-secret
      DEBUG: "true"
      ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: "http://localhost"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Pick this job's test files
        # Every sixth test file, in sorted order, from the same folders
        # pytest.ini lists under testpaths. Round-robin keeps the big apps
        # (recaps, events, ambassadors) spread across all six jobs.
        run: |
          git ls-files tenants/tests events/tests jobs/tests ambassadors/tests recaps/tests chats/tests pilot/tests brand_insights/tests brand_chat/tests staffing/tests \
            | grep -E '(^|/)(test_[^/]*|[^/]*_tests|tests)\.py$' \
            | sort \
            | awk -v n=6 -v k=${{ matrix.shard }} 'NR % n == k % n' > shard-files.txt
          echo "$(wc -l < shard-files.txt) test files in this job"
          test -s shard-files.txt
      - name: Run test suite
        run: xargs uv run pytest -q -p no:cacheprovider < shard-files.txt

  pytest:
    # One result for the whole suite, under the name the single job used to
    # have, so anything that waits on "pytest" still works.
    if: always() && (github.event_name == 'push' || github.base_ref == 'develop')
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - name: All six jobs passed
        run: |
          echo "shard result: ${{ needs.shard.result }}"
          test "${{ needs.shard.result }}" = "success"
