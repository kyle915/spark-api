name: Tests

# PR gate + develop check: the full pytest suite against a disposable
# Postgres. Until now spark-api had NO CI — tests only ran when someone ran
# them locally, which twice let runtime-broken changes reach prod that the
# existing suite would have caught (a management command with a swallowed
# `def handle`, stale IDOR-message assertions). Redis is deliberately absent:
# the queue layer logs-and-falls-back inline, same as prod.

on:
  pull_request:
  push:
    branches: [develop]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spark_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/spark_tests
      # Also set DATABASE_URL directly: pytest-django touches settings before
      # the root conftest can map TEST_DATABASE_URL onto it, and settings
      # requires DATABASE_URL at import time.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/spark_tests
      # Throwaway values — settings requires these with no default; nothing
      # in the test run talks to real services.
      SECRET_KEY: ci-only-not-a-secret
      DEBUG: "true"
      ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: "http://localhost"
    steps:
      - uses: actions/checkout@v4
      - name: Gate pytest
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # main is a dispatch-only copy of GitHub Actions YAML. Its pytest
          # suite is years behind develop (global IDs, role PKs, missing
          # fields) and fails ~80 tests on every workflow-only PR. Skip the
          # suite when the PR touches nothing outside .github/.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" --jq '.[].filename')
          echo "$files"
          extra=$(printf '%s\n' "$files" | grep -vE '^\.github/' || true)
          if [ -n "$extra" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Workflow-only PR; skipping pytest."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@v5
        if: steps.gate.outputs.run == 'true'
        with:
          enable-cache: true
      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: uv sync --locked
      - name: Run test suite
        if: steps.gate.outputs.run == 'true'
        run: uv run pytest -q -p no:cacheprovider
