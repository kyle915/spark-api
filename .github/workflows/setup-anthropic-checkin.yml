name: Setup Anthropic check-in

# Seeds the Anthropic BA Event Recap template (PDF minus Date / Event Location
# and Expense Receipts), creates the tenant if missing, and mints the standing
# AN- check-in code. Idempotent. Recaps stay human-reviewed.
#
# RUN apply=false FIRST AND READ THE LOG.

on:
  workflow_dispatch:
    inputs:
      tenant:
        description: "Tenant name/slug substring"
        required: false
        default: "anthropic"
      prefix:
        description: "Brand prefix for a NEW code. Blank = AN-"
        required: false
        default: ""
      apply:
        description: "Actually write (read the dry run first)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  setup-anthropic-checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Fire setup endpoint
        env:
          CRON_URL: https://spark-api-new-490085168610.us-central1.run.app/internal/cron/setup-anthropic-checkin
          CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
          TENANT: ${{ github.event.inputs.tenant }}
          PREFIX: ${{ github.event.inputs.prefix }}
          APPLY: ${{ github.event.inputs.apply }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::INTERNAL_CRON_SECRET is not set in repo secrets."
            exit 1
          fi
          STATUS=$(curl -sS -o /tmp/cron-response.json -w '%{http_code}' \
            -X POST "$CRON_URL" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            --data-urlencode "tenant=$TENANT" \
            --data-urlencode "prefix=$PREFIX" \
            --data-urlencode "apply=$APPLY")
          echo "HTTP $STATUS"
          cat /tmp/cron-response.json
          echo ""
          [ "$STATUS" != "200" ] && exit 1 || exit 0
