name: Reclassify On-Premise to Retail Sampling (manual)

# Manually fires `/internal/cron/reclassify-onpremise-to-retail` on Cloud Run
# to run `reclassify_onpremise_to_retail`: moves one tenant's On-Premise
# requests / events / templates onto its own Retail Sampling types and
# retires the tenant's now-unreferenced on-prem types. Never changes recap
# metrics, approval, or other tenants. Logs before/after per row. See
# events/management/commands/reclassify_onpremise_to_retail.py.
#
# DRY-RUN unless `apply` is checked. Secret-gated via X-Cron-Secret (shared
# INTERNAL_CRON_SECRET) — a HEADER, never the URL.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write the changes (unchecked = dry run)."
        required: false
        default: false
        type: boolean
      tenant:
        description: "Tenant slug (exact), else request_url_name."
        required: false
        default: "torch-thc"
        type: string

jobs:
  fire-reclassify-onpremise-to-retail:
    runs-on: ubuntu-latest
    steps:
      - name: Fire reclassify-onpremise-to-retail cron endpoint
        env:
          CRON_URL: https://spark-api-new-490085168610.us-central1.run.app/internal/cron/reclassify-onpremise-to-retail
          CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
          APPLY: ${{ github.event.inputs.apply }}
          TENANT: ${{ github.event.inputs.tenant || 'torch-thc' }}
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::INTERNAL_CRON_SECRET is not set in repo secrets."
            exit 1
          fi
          STATUS=$(curl -sS -o /tmp/cron-response.json -w '%{http_code}' \
            --max-time 300 \
            -X POST "$CRON_URL" \
            --data-urlencode "tenant=$TENANT" \
            --data-urlencode "apply=$APPLY" \
            -H "X-Cron-Secret: $CRON_SECRET")
          echo "HTTP $STATUS"
          python3 -c "import json; d=json.load(open('/tmp/cron-response.json')); open('/tmp/onpremise-to-retail.txt','w').write(d.get('log') or json.dumps(d)); print(d.get('log') or d); print(d.get('detail') or '')"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Cron endpoint returned $STATUS — see body above."
            exit 1
          fi
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onpremise-to-retail
          path: /tmp/onpremise-to-retail.txt
          if-no-files-found: ignore
