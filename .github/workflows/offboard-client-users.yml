name: Offboard client users (manual)

# Manually fires `/internal/cron/offboard-client-users` on Cloud Run to run
# `offboard_client_users`: deactivates people who left a client brand, drops
# them from recap mail (membership + Tenant.recap_recipient_emails +
# default_external_rmm), and hands their upcoming requests and events to
# reassign_to. Past work stays credited to them.
# See tenants/management/commands/offboard_client_users.py.
#
# SAFE — DRY-RUN IS THE DEFAULT. Set dry_run=false to write. Secret-gated via
# X-Cron-Secret (shared INTERNAL_CRON_SECRET) — a HEADER, never the URL.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no DB writes). Leave true to preview; set false to apply."
        required: true
        default: true
        type: boolean
      tenant_slug:
        description: "Tenant slug or request-form slug (e.g. ighn-liquid-death)."
        required: true
        type: string
      emails:
        description: "Comma-separated emails of the people to offboard."
        required: true
        type: string
      reassign_to:
        description: "Email of the person who takes over their upcoming requests/events (optional)."
        required: false
        default: ""
        type: string

jobs:
  fire-offboard-client-users:
    runs-on: ubuntu-latest
    steps:
      - name: Fire offboard-client-users cron endpoint
        env:
          CRON_URL: https://spark-api-new-490085168610.us-central1.run.app/internal/cron/offboard-client-users
          CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          TENANT_SLUG: ${{ github.event.inputs.tenant_slug }}
          EMAILS: ${{ github.event.inputs.emails }}
          REASSIGN_TO: ${{ github.event.inputs.reassign_to }}
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::INTERNAL_CRON_SECRET is not set in repo secrets."
            exit 1
          fi
          if [ "$DRY_RUN" = "false" ]; then APPLY=true; else APPLY=false; fi

          STATUS=$(curl -sS -o /tmp/cron-response.json -w '%{http_code}' \
            -X POST "$CRON_URL" \
            --data-urlencode "apply=$APPLY" \
            --data-urlencode "tenant_slug=$TENANT_SLUG" \
            --data-urlencode "emails=$EMAILS" \
            --data-urlencode "reassign_to=$REASSIGN_TO" \
            -H "X-Cron-Secret: $CRON_SECRET")
          echo "HTTP $STATUS"
          python3 -c "import json; d=json.load(open('/tmp/cron-response.json')); print(d.get('log') or d)"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Cron endpoint returned $STATUS — see body above."
            exit 1
          fi
