name: Strip Torch suppress recipients

# Manually fires `/internal/cron/strip-torch-suppress-recipients` on Cloud Run
# to remove TORCH_SUPPRESS_EMAILS (baesha@…) from Torch tenant recipient
# fields only. Does not deactivate the user or touch other brands.
#
# SAFE — DRY-RUN IS THE DEFAULT. Set dry_run=false to write.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no DB writes). Leave true to preview; set false to apply."
        required: true
        default: true
        type: boolean

jobs:
  strip-torch-suppress-recipients:
    runs-on: ubuntu-latest
    steps:
      - name: Fire strip-torch-suppress-recipients cron endpoint
        env:
          CRON_URL: https://spark-api-new-490085168610.us-central1.run.app/internal/cron/strip-torch-suppress-recipients
          CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::INTERNAL_CRON_SECRET is not set in repo secrets."
            exit 1
          fi
          if [ "$DRY_RUN" = "false" ]; then APPLY=true; else APPLY=false; fi

          STATUS=$(curl -sS -o /tmp/cron-response.json -w '%{http_code}' \
            -X POST "$CRON_URL" \
            --data-urlencode "apply=$APPLY" \
            -H "X-Cron-Secret: $CRON_SECRET")
          echo "HTTP $STATUS"
          python3 -c "import json; d=json.load(open('/tmp/cron-response.json')); print(d.get('log') or d)"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Cron endpoint returned $STATUS — see body above."
            exit 1
          fi
