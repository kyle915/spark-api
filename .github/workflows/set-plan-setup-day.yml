name: Set plan setup day

# Manual. Flags a Torch field-marketing plan as a setup / load-in day so it
# never counts toward "Local event sponsorships" days (planned or actual).
# search lists matching plans (id + REQ code) and writes nothing; plan takes
# a plan uuid or REQ-XXXX and prints the scorecard before / after. Dry run
# rolls back; apply=true writes. Sends nothing; never touches a recap.
# See events/management/commands/set_plan_setup_day.py.

on:
  workflow_dispatch:
    inputs:
      search:
        description: "Text in plan name / address / notes (lists plans)"
        required: false
        default: ""
      plan:
        description: "Plan uuid or REQ-XXXX to flag (blank = list only)"
        required: false
        default: ""
      off:
        description: "Clear the flag instead"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      apply:
        description: "Write (false = dry run)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  set-plan-setup-day:
    runs-on: ubuntu-latest
    steps:
      - name: Fire set-plan-setup-day cron endpoint
        env:
          CRON_URL: https://spark-api-new-490085168610.us-central1.run.app/internal/cron/set-plan-setup-day
          CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
          SEARCH: ${{ github.event.inputs.search || '' }}
          PLAN: ${{ github.event.inputs.plan || '' }}
          OFF: ${{ github.event.inputs.off || 'false' }}
          APPLY: ${{ github.event.inputs.apply || 'false' }}
        run: |
          set -euo pipefail

          if [ -z "$CRON_SECRET" ]; then
            echo "::error::INTERNAL_CRON_SECRET is not set in repo secrets."
            exit 1
          fi

          STATUS=$(curl -sS -o /tmp/cron-response.json -w '%{http_code}' \
            --max-time 900 \
            -X POST "$CRON_URL" \
            --data-urlencode "search=$SEARCH" \
            --data-urlencode "plan=$PLAN" \
            --data-urlencode "off=$OFF" \
            --data-urlencode "apply=$APPLY" \
            -H "X-Cron-Secret: $CRON_SECRET")

          echo "HTTP $STATUS"
          python3 -c 'import json; d=json.load(open("/tmp/cron-response.json")); print(d.get("log") or d)'
          if [ "$STATUS" != "200" ]; then
            echo "::error::Cron endpoint returned $STATUS — see body above."
            exit 1
          fi
