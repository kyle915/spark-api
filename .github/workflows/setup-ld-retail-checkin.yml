name: Setup LD retail check-in

# Mints Liquid Death's retail-sampling check-in code, pins the event type the
# link stamps, and adds the 31-SKU "Products Sampled" multi-select to their
# EXISTING template.
#
# It never creates a template. LD already has "Liquid Death-Retail Sampling";
# a second one would split the brand's recaps across two forms and halve every
# dashboard number.
#
# The event-type pin is the load-bearing part: LD runs two programs, and the
# walk-in path used to pick the tenant's lowest-id type, which could hand a
# retail BA the Event Activation form without anything looking broken.
#
# Idempotent — re-running refreshes the SKU option list in place, so adding a
# product to the line-up is just another dispatch.

on:
  workflow_dispatch:
    inputs:
      tenant:
        description: "Tenant name/slug substring"
        required: false
        default: "liquid death"
      code:
        description: "Force a specific check-in code (keeps an already-shared link). Blank = mint/keep"
        required: false
        default: ""
      training_url:
        description: "BA reference link shown on the check-in page. Blank = leave as-is"
        required: false
        default: "https://admin.igniteproductions.co/training/LD-FZUWXT"
      skip_products:
        description: "Don't touch the template; only mint the code + pin the event type"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      apply:
        description: "Actually write (read the dry run first)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  setup-ld-retail-checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Fire setup endpoint
        env:
          CRON_URL: https://spark-api-new-490085168610.us-central1.run.app/internal/cron/setup-ld-retail-checkin
          CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
          TENANT: ${{ github.event.inputs.tenant }}
          CODE: ${{ github.event.inputs.code }}
          TRAINING_URL: ${{ github.event.inputs.training_url }}
          SKIP_PRODUCTS: ${{ github.event.inputs.skip_products }}
          APPLY: ${{ github.event.inputs.apply }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::INTERNAL_CRON_SECRET is not set in repo secrets."
            exit 1
          fi
          STATUS=$(curl -sS -o /tmp/cron-response.json -w '%{http_code}' \
            -X POST "$CRON_URL" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            --data-urlencode "tenant=$TENANT" \
            --data-urlencode "code=$CODE" \
            --data-urlencode "training_url=$TRAINING_URL" \
            --data-urlencode "skip_products=$SKIP_PRODUCTS" \
            --data-urlencode "apply=$APPLY")
          echo "HTTP $STATUS"
          cat /tmp/cron-response.json
          echo ""
          [ "$STATUS" != "200" ] && exit 1 || exit 0
