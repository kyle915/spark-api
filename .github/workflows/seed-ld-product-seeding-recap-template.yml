name: Seed LD Product Seeding recap template

# Seeds Liquid Death's Product Seeding event type +
# Liquid Death-Product Seeding recap template (location, cases, SKU cases,
# mileage). See seed_ld_product_seeding_recap_template.py.
#
# After apply=true, also run Setup LD retail check-in with apply=true so the
# standing LD- link offers Product Seeding alongside Retail + Event.
#
# RUN apply=false FIRST AND READ THE LOG.

on:
  workflow_dispatch:
    inputs:
      tenant:
        description: "Tenant name/slug substring"
        required: false
        default: "liquid death"
      apply:
        description: "Actually write (read the dry run first)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  seed-ld-product-seeding-recap-template:
    runs-on: ubuntu-latest
    steps:
      - name: Fire seed-ld-product-seeding-recap-template cron endpoint
        env:
          CRON_URL: https://spark-api-new-490085168610.us-central1.run.app/internal/cron/seed-ld-product-seeding-recap-template
          CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
          TENANT: ${{ github.event.inputs.tenant }}
          APPLY: ${{ github.event.inputs.apply }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::INTERNAL_CRON_SECRET is not set in repo secrets."
            exit 1
          fi
          STATUS=$(curl -sS -o /tmp/cron-response.json -w '%{http_code}' \
            -X POST "$CRON_URL" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            --data-urlencode "tenant=$TENANT" \
            --data-urlencode "apply=$APPLY")
          echo "HTTP $STATUS"
          cat /tmp/cron-response.json
          echo ""
          [ "$STATUS" != "200" ] && exit 1 || exit 0
