name: Setup Torch Event Activation

# Adds Event Activation to Torch THC's BA walk-up (/checkin/TH-2HRV3D, never
# reminted) and seeds the sampling-only "Torch THC-Event Activation" recap
# template + LD/MAB activation photo buckets. Retail Sampling and TH-AGENCY
# are left alone. Dry-run first; apply=true writes prod. Idempotent.
# See recaps/management/commands/setup_torch_event_activation.py.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write to the DB (false = dry run)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      tenant:
        description: "Tenant slug (default torch-thc)"
        required: false
        default: "torch-thc"

jobs:
  setup-torch-event-activation:
    runs-on: ubuntu-latest
    steps:
      - name: Fire setup-torch-event-activation endpoint
        env:
          CRON_URL: https://spark-api-new-490085168610.us-central1.run.app/internal/cron/setup-torch-event-activation
          CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
          APPLY: ${{ github.event.inputs.apply }}
          TENANT: ${{ github.event.inputs.tenant }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::INTERNAL_CRON_SECRET is not set in repo secrets."
            exit 1
          fi
          STATUS=$(curl -sS -o /tmp/cron-response.json -w '%{http_code}' \
            --max-time 300 \
            -X POST "$CRON_URL" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            --data-urlencode "apply=$APPLY" \
            --data-urlencode "tenant=$TENANT")
          echo "HTTP $STATUS"
          STATUS="$STATUS" python3 -c "
          import json, os, sys
          status = os.environ.get('STATUS', '')
          try:
              d = json.load(open('/tmp/cron-response.json'))
          except Exception:
              sys.stdout.write(open('/tmp/cron-response.json').read() if os.path.exists('/tmp/cron-response.json') else '(no body)\n')
              print(f'::error::setup-torch-event-activation returned HTTP {status} with a non-JSON body.')
              sys.exit(1)
          print(d.get('log') or '(no log)')
          if d.get('ok') and status == '200':
              sys.exit(0)
          err = d.get('error') or ''
          detail = d.get('detail') or ''
          msg = ' '.join(p for p in (err, detail) if p).strip() or f'HTTP {status}'
          print(f'::error::{msg}')
          sys.exit(1)
          "
