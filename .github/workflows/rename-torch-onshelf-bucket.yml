name: Rename Torch On-Shelf photo bucket

# Relabels Torch THC's shelf/stock FileRecapCategory + checkin_photo_buckets
# from "On-Shelf Product" to "Before & After Shelf / Stock" in place.
# Does not remint TH-2HRV3D. Dry-run first; apply=true writes prod.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write to the DB (false = dry run)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      tenant:
        description: "Tenant slug (default torch-thc)"
        required: false
        default: "torch-thc"

jobs:
  rename-torch-onshelf-bucket:
    runs-on: ubuntu-latest
    steps:
      - name: Fire rename endpoint
        env:
          CRON_URL: https://spark-api-new-490085168610.us-central1.run.app/internal/cron/rename-torch-onshelf-bucket
          CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
          APPLY: ${{ github.event.inputs.apply }}
          TENANT: ${{ github.event.inputs.tenant }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::INTERNAL_CRON_SECRET is not set in repo secrets."
            exit 1
          fi
          STATUS=$(curl -sS -o /tmp/cron-response.json -w '%{http_code}' \
            --max-time 300 \
            -X POST "$CRON_URL" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            --data-urlencode "apply=$APPLY" \
            --data-urlencode "tenant=$TENANT")
          echo "HTTP $STATUS"
          STATUS="$STATUS" APPLY="$APPLY" python3 -c "
          import json, os, sys
          status = os.environ.get('STATUS', '')
          try:
              d = json.load(open('/tmp/cron-response.json'))
          except Exception:
              sys.stdout.write(open('/tmp/cron-response.json').read() if os.path.exists('/tmp/cron-response.json') else '(no body)\n')
              print(f'::error::rename-torch-onshelf-bucket returned HTTP {status} with a non-JSON body.')
              sys.exit(1)
          print(d.get('log') or '(no log)')
          if d.get('ok') and status == '200':
              sys.exit(0)
          err = d.get('error') or ''
          detail = d.get('detail') or ''
          msg = ' '.join(p for p in (err, detail) if p).strip() or f'HTTP {status}'
          print(f'::error::{msg}')
          sys.exit(1)
          "
