name: Backfill Torch public-form Sheet

# Append specific Torch public spark-form requests (REQ ids) onto
# External // Torch Beverage Retail Demos. Does not dump Binny bulk.
# Dry-run by default.

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Comma-separated Request PKs"
        required: true
        default: "1980,1981"
      apply:
        description: "Write to the Sheet"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  backfill-torch-public-form-sheet:
    runs-on: ubuntu-latest
    steps:
      - name: Fire backfill endpoint
        env:
          CRON_URL: https://spark-api-new-490085168610.us-central1.run.app/internal/cron/backfill-torch-public-form-sheet
          CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
          IDS: ${{ github.event.inputs.ids }}
          APPLY: ${{ github.event.inputs.apply }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::INTERNAL_CRON_SECRET is not set in repo secrets."
            exit 1
          fi
          STATUS=$(curl -sS -o /tmp/cron-response.json -w '%{http_code}' \
            -X POST "$CRON_URL" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            --data-urlencode "ids=$IDS" \
            --data-urlencode "apply=$APPLY")
          echo "HTTP $STATUS"
          cat /tmp/cron-response.json
          echo ""
          [ "$STATUS" != "200" ] && exit 1 || exit 0
