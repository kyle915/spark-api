name: Setup MAB Long Drink check-in

# Total Wine Long Drink retail on Mark Anthony Brands: Torch-style recap
# wording, Long Drink SKUs + can art, standing MAB-V696HM (never reminted).
# Training PDF is hosted on spark-front-client; apply set-checkin-resources
# after that Firebase deploy.
#
# RUN apply=false FIRST AND READ THE LOG.

on:
  workflow_dispatch:
    inputs:
      tenant:
        description: "Tenant name/slug substring"
        required: false
        default: "mark anthony"
      owner_email:
        description: "Spark admin email that owns product rows"
        required: false
        default: "kyle@igniteproductions.co"
      code:
        description: "Standing walk-up code (do not remint)"
        required: false
        default: "MAB-V696HM"
      skip_images:
        description: "Skip can artwork downloads"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      apply:
        description: "Actually write (read the dry run first)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  setup-mab-long-drink-checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Fire setup-mab-long-drink-checkin cron endpoint
        env:
          CRON_URL: https://spark-api-new-490085168610.us-central1.run.app/internal/cron/setup-mab-long-drink-checkin
          CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
          TENANT: ${{ github.event.inputs.tenant }}
          OWNER_EMAIL: ${{ github.event.inputs.owner_email }}
          CODE: ${{ github.event.inputs.code }}
          SKIP_IMAGES: ${{ github.event.inputs.skip_images }}
          APPLY: ${{ github.event.inputs.apply }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::INTERNAL_CRON_SECRET is not set in repo secrets."
            exit 1
          fi
          STATUS=$(curl -sS -o /tmp/cron-response.json -w '%{http_code}' \
            -X POST "$CRON_URL" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            --data-urlencode "tenant=$TENANT" \
            --data-urlencode "owner_email=$OWNER_EMAIL" \
            --data-urlencode "code=$CODE" \
            --data-urlencode "skip_images=$SKIP_IMAGES" \
            --data-urlencode "apply=$APPLY")
          echo "HTTP $STATUS"
          cat /tmp/cron-response.json
          echo ""
          [ "$STATUS" != "200" ] && exit 1 || exit 0
