name: tmp-fetch-cron-secret
on:
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Write secret to artifact (do not echo)
        env:
          SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "::error::INTERNAL_CRON_SECRET missing"
            exit 1
          fi
          printf '%s' "$SECRET" > cron_secret.txt
          echo "wrote bytes=$(wc -c < cron_secret.txt)"
      - uses: actions/upload-artifact@v4
        with:
          name: cron-secret
          path: cron_secret.txt
          retention-days: 1
          if-no-files-found: error
