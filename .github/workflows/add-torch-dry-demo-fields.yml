name: Add Torch dry-demo recap fields (manual)

# Manually fires `/internal/cron/add-torch-dry-demo-fields` on Cloud Run to
# run `add_torch_dry_demo_fields`: adds "Dry demo?" + "People engaged" to the
# Torch THC-Retail Sampling template (walk-up TH-2HRV3D and agency TH-AGENCY;
# neither code is reminted). See
# recaps/management/commands/add_torch_dry_demo_fields.py.
#
# DRY-RUN unless `apply` is checked. Secret-gated via X-Cron-Secret (shared
# INTERNAL_CRON_SECRET) — a HEADER, never the URL.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write the fields (unchecked = dry run)."
        required: false
        default: false
        type: boolean
      tenant:
        description: "Tenant slug (exact), else request_url_name."
        required: false
        default: "torch-thc"
        type: string

jobs:
  fire-add-torch-dry-demo-fields:
    runs-on: ubuntu-latest
    steps:
      - name: Fire add-torch-dry-demo-fields cron endpoint
        env:
          CRON_URL: https://spark-api-new-490085168610.us-central1.run.app/internal/cron/add-torch-dry-demo-fields
          CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
          APPLY: ${{ github.event.inputs.apply }}
          TENANT: ${{ github.event.inputs.tenant || 'torch-thc' }}
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::INTERNAL_CRON_SECRET is not set in repo secrets."
            exit 1
          fi
          STATUS=$(curl -sS -o /tmp/cron-response.json -w '%{http_code}' \
            --max-time 300 \
            -X POST "$CRON_URL" \
            --data-urlencode "tenant=$TENANT" \
            --data-urlencode "apply=$APPLY" \
            -H "X-Cron-Secret: $CRON_SECRET")
          echo "HTTP $STATUS"
          python3 -c "import json; d=json.load(open('/tmp/cron-response.json')); open('/tmp/torch-dry-demo-fields.txt','w').write(d.get('log') or json.dumps(d)); print(d.get('log') or d); print(d.get('detail') or '')"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Cron endpoint returned $STATUS — see body above."
            exit 1
          fi
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: torch-dry-demo-fields
          path: /tmp/torch-dry-demo-fields.txt
          if-no-files-found: ignore
