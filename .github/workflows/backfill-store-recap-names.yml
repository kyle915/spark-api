name: Backfill store recap names (manual)

# Manually fires `/internal/cron/backfill-store-recap-names` on Cloud Run to
# run `backfill_store_recap_names`: retitles already-filed recaps to
# "Store Name #1234" (the recap PDF's Summary → Name). Store # comes from
# numbers_json, the event's request, or another request at the same address.
# Hand-typed titles are left alone. The log ends with stores still missing a #.
# See recaps/management/commands/backfill_store_recap_names.py.
#
# SAFE — DRY-RUN IS THE DEFAULT. Set dry_run=false to write. Secret-gated via
# X-Cron-Secret (shared INTERNAL_CRON_SECRET) — a HEADER, never the URL.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no DB writes). Leave true to preview; set false to apply."
        required: true
        default: true
        type: boolean
      tenant_slug:
        description: "Tenant slug."
        required: false
        default: "keee-torch-thc"
        type: string
      numbers_json:
        description: 'Optional store numbers, e.g. {"Total Wine & More (Sarasota)": "1234"}'
        required: false
        default: ""
        type: string

jobs:
  fire-backfill-store-recap-names:
    runs-on: ubuntu-latest
    steps:
      - name: Fire backfill-store-recap-names cron endpoint
        env:
          CRON_URL: https://spark-api-new-490085168610.us-central1.run.app/internal/cron/backfill-store-recap-names
          CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          TENANT_SLUG: ${{ github.event.inputs.tenant_slug || 'keee-torch-thc' }}
          NUMBERS_JSON: ${{ github.event.inputs.numbers_json }}
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::INTERNAL_CRON_SECRET is not set in repo secrets."
            exit 1
          fi
          if [ "$DRY_RUN" = "false" ]; then APPLY=true; else APPLY=false; fi

          STATUS=$(curl -sS -o /tmp/cron-response.json -w '%{http_code}' \
            -X POST "$CRON_URL" \
            --data-urlencode "apply=$APPLY" \
            --data-urlencode "tenant_slug=$TENANT_SLUG" \
            --data-urlencode "numbers_json=$NUMBERS_JSON" \
            -H "X-Cron-Secret: $CRON_SECRET")
          echo "HTTP $STATUS"
          python3 -c "import json; d=json.load(open('/tmp/cron-response.json')); print(d.get('log') or d)"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Cron endpoint returned $STATUS — see body above."
            exit 1
          fi
