name: Resend recent sends (read-only)

# Fires `/internal/cron/resend-recent-sends` on Cloud Run: lists recent Resend
# emails to one recipient with their last delivery event (delivered, bounced,
# suppressed ...). Confirms a send without Cloud Logging access.
# READ-ONLY — never sends. Secret-gated via X-Cron-Secret (INTERNAL_CRON_SECRET).

on:
  workflow_dispatch:
    inputs:
      recipient:
        description: "Email address to look up"
        required: true
        type: string
      pages:
        description: "Pages of 100 recent emails to scan (max 20)"
        required: false
        default: "3"
        type: string

jobs:
  fire-resend-recent-sends:
    runs-on: ubuntu-latest
    steps:
      - name: Fire resend-recent-sends cron endpoint
        env:
          CRON_URL: https://spark-api-new-490085168610.us-central1.run.app/internal/cron/resend-recent-sends
          CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
          RECIPIENT: ${{ github.event.inputs.recipient }}
          PAGES: ${{ github.event.inputs.pages || '3' }}
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::INTERNAL_CRON_SECRET is not set in repo secrets."
            exit 1
          fi
          STATUS=$(curl -sS -o /tmp/cron-response.json -w '%{http_code}' \
            -X POST "$CRON_URL" \
            --data-urlencode "recipient=$RECIPIENT" \
            --data-urlencode "pages=$PAGES" \
            -H "X-Cron-Secret: $CRON_SECRET")
          echo "HTTP $STATUS"
          cat /tmp/cron-response.json
          if [ "$STATUS" != "200" ]; then
            echo "::error::Cron endpoint returned $STATUS — see body above."
            exit 1
          fi
