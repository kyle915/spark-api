name: Setup Total Wireless check-in

# Seeds the "Total Wireless - BA Event Recap" template AND mints the tenant's
# STANDING check-in code, in one idempotent run.
#
# The standing code is the point: one durable URL pinned on the Total Wireless
# page, so BAs never type an event code. They open it on a phone, give name +
# cell, pick store + date, clock in/out and file the recap. One link serves
# hundreds of events; several BAs at one store on one day share ONE event.
#
# Idempotent — get_or_create for the template, and an existing code is left
# alone (rotating it would break every copy already shared). Run apply=false
# first; the dry run prints the exact template and the link it would mint.

on:
  workflow_dispatch:
    inputs:
      tenant:
        description: "Tenant name/slug substring"
        required: false
        default: "total-wireless"
      template_name:
        description: "Template name (blank = the default)"
        required: false
        default: ""
      event_type:
        description: "Event type substring to attach the template to (blank = prefer 'retail')"
        required: false
        default: ""
      apply:
        description: "Actually write the template + code"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  setup-total-wireless-checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Fire setup endpoint
        env:
          CRON_URL: https://spark-api-new-490085168610.us-central1.run.app/internal/cron/setup-total-wireless-checkin
          CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
          TENANT: ${{ github.event.inputs.tenant }}
          TEMPLATE_NAME: ${{ github.event.inputs.template_name }}
          EVENT_TYPE: ${{ github.event.inputs.event_type }}
          APPLY: ${{ github.event.inputs.apply }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::INTERNAL_CRON_SECRET is not set in repo secrets."
            exit 1
          fi
          STATUS=$(curl -sS -o /tmp/cron-response.json -w '%{http_code}' \
            -X POST "$CRON_URL" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            --data-urlencode "tenant=$TENANT" \
            --data-urlencode "template_name=$TEMPLATE_NAME" \
            --data-urlencode "event_type=$EVENT_TYPE" \
            --data-urlencode "apply=$APPLY")
          echo "HTTP $STATUS"
          cat /tmp/cron-response.json
          echo ""
          [ "$STATUS" != "200" ] && exit 1 || exit 0
