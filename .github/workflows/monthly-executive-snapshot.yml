name: Monthly executive snapshot briefs

# Fires `/internal/cron/send-monthly-executive-snapshots` on Cloud Run on the
# 1st of each month (15:30 UTC). Generates each opted-in brand's Executive
# Snapshot email + PDF brief (KPIs vs. prior month, top 5 converting doors,
# Shelf OSA & price-drift callouts, top 3 shopper themes, 4 best field photos).
#
# SAFE — OPT-IN OFF by default (`ExecutiveSnapshotConfig.enabled = False`).

on:
  schedule:
    - cron: "30 15 1 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Override reporting month as YYYY-MM (default: prior complete month)"
        required: false
        default: ""
      tenant:
        description: "Restrict to a single tenant id (optional)"
        required: false
        default: ""
      dry_run:
        description: "Generate + log recipients, but send no email"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      force:
        description: "Bypass idempotency / empty checks"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  fire-monthly-executive-snapshots:
    runs-on: ubuntu-latest
    steps:
      - name: Fire monthly executive snapshots cron endpoint
        env:
          CRON_URL: https://spark-api-new-490085168610.us-central1.run.app/internal/cron/send-monthly-executive-snapshots
          CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
          MONTH: ${{ github.event.inputs.month || '' }}
          TENANT: ${{ github.event.inputs.tenant || '' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::INTERNAL_CRON_SECRET is not set in repo secrets."
            exit 1
          fi

          QS="dry_run=$DRY_RUN&force=$FORCE"
          if [ -n "$MONTH" ]; then
            QS="$QS&month=$MONTH"
          fi
          if [ -n "$TENANT" ]; then
            QS="$QS&tenant=$TENANT"
          fi

          STATUS=$(curl -sS -o /tmp/cron-response.json -w '%{http_code}' \
            -X POST "$CRON_URL?$QS" \
            -H "X-Cron-Secret: $CRON_SECRET")
          echo "HTTP $STATUS"
          cat /tmp/cron-response.json
          if [ "$STATUS" != "200" ]; then
            echo "::error::Cron endpoint returned $STATUS — see body above."
            exit 1
          fi
