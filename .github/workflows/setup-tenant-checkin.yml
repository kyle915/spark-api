name: Setup tenant check-in link

# Turns on the STANDING check-in link for ANY tenant — the generic form of the
# per-brand workflows (Setup LD retail check-in, Setup Feel Free check-in, Setup
# Total Wireless check-in). Use this one for a new brand; the three brand
# workflows stay because they carry brand-specific payloads (LD's 31 SKUs, Feel
# Free's market list).
#
# What it does: mints/keeps `Tenant.checkin_code`, pins the program(s) the link
# opens, and backs each photo dropzone with a real FileRecapCategory row.
#
# THE PIN IS THE LOAD-BEARING PART. Without it the walk-in path falls back to
# the tenant's LOWEST-ID event type, and the event type is what decides WHICH
# RECAP FORM the BA is handed — so a retail BA can silently get some other
# program's form and nothing looks broken, because the recap still submits.
#
# ONE LINK PER BRAND, not one per program. `checkin_code` is a single column,
# so minting a second link repoints the first and every BA holding the old URL
# lands somewhere else. A brand running two programs puts both in `event_type`
# (one per line); the BA is then asked which they're working and their answer
# picks the form. The FIRST line is the pinned default.
#
# Idempotent. An existing code is KEPT unless `code` forces one. Bucket names
# are matched to existing categories case/punctuation-insensitively, so a
# re-run can't leave a brand with both "Table setup" and "Table Set Up" in
# their recap PDF.
#
# Read the DRY RUN first: it prints the tenant's current categories, which
# recap form each program resolves to (and warns if a program has none), and
# exactly which buckets would be created, reused or relabelled.

on:
  # Dispatch only. This hits production and can mint Tenant.checkin_code —
  # a push trigger would fire on every merge with empty inputs and 500.
  workflow_dispatch:
    inputs:
      tenant_id:
        description: "Tenant id (preferred — exact). Find it on /clients"
        required: false
        default: ""
      tenant:
        description: "…or a name/slug substring, if you don't have the id"
        required: false
        default: ""
      event_type:
        description: "Program(s) the link opens, one per line. First = pinned default. Blank = the tenant's only event type"
        required: false
        default: ""
      code_prefix:
        description: "Prefix for a newly minted code (e.g. RB). Blank = tenant initials"
        required: false
        default: ""
      code:
        description: "Force a specific full code (keeps an already-shared link). Blank = mint/keep"
        required: false
        default: ""
      photo_buckets:
        description: 'JSON dropzones, e.g. [{"name":"Table Set Up"},{"name":"Product Receipt"}]. Blank = leave the generic photo grid'
        required: false
        default: ""
      location_mode:
        description: "How the link asks where the BA is working"
        required: false
        default: ""
        type: choice
        options: ["", "address", "market"]
      training_url:
        description: "BA reference link on the check-in page. Blank = leave as-is"
        required: false
        default: ""
      apply:
        description: "Actually write (read the dry run first)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  setup-tenant-checkin:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Fire setup endpoint
        env:
          CRON_URL: https://spark-api-new-490085168610.us-central1.run.app/internal/cron/setup-tenant-checkin
          CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
          TENANT_ID: ${{ github.event.inputs.tenant_id }}
          TENANT: ${{ github.event.inputs.tenant }}
          EVENT_TYPE: ${{ github.event.inputs.event_type }}
          CODE_PREFIX: ${{ github.event.inputs.code_prefix }}
          CODE: ${{ github.event.inputs.code }}
          PHOTO_BUCKETS: ${{ github.event.inputs.photo_buckets }}
          LOCATION_MODE: ${{ github.event.inputs.location_mode }}
          TRAINING_URL: ${{ github.event.inputs.training_url }}
          APPLY: ${{ github.event.inputs.apply }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::INTERNAL_CRON_SECRET is not set in repo secrets."
            exit 1
          fi
          if [ -z "$TENANT_ID" ] && [ -z "$TENANT" ]; then
            echo "::notice::No tenant_id or tenant given — skipping. Dispatch this workflow with a tenant; it does not run on push."
            exit 0
          fi
          STATUS=$(curl -sS -o /tmp/cron-response.json -w '%{http_code}' \
            --max-time 300 \
            -X POST "$CRON_URL" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            --data-urlencode "tenant_id=$TENANT_ID" \
            --data-urlencode "tenant=$TENANT" \
            --data-urlencode "event_type=$EVENT_TYPE" \
            --data-urlencode "code_prefix=$CODE_PREFIX" \
            --data-urlencode "code=$CODE" \
            --data-urlencode "photo_buckets=$PHOTO_BUCKETS" \
            --data-urlencode "location_mode=$LOCATION_MODE" \
            --data-urlencode "training_url=$TRAINING_URL" \
            --data-urlencode "apply=$APPLY")
          echo "HTTP $STATUS"
          # The command's own report is the point of this workflow, and it
          # arrives as one JSON-escaped string. Print it as real lines so the
          # dry run is readable without copy-pasting it somewhere else.
          STATUS="$STATUS" APPLY="$APPLY" python3 -c "
          import json, os, sys
          status = os.environ.get('STATUS', '')
          apply = (os.environ.get('APPLY') or '').strip().lower()
          try:
              d = json.load(open('/tmp/cron-response.json'))
          except Exception:
              sys.stdout.write(open('/tmp/cron-response.json').read() if os.path.exists('/tmp/cron-response.json') else '(no body)\n')
              print(f'::error::setup-tenant-checkin returned HTTP {status} with a non-JSON body.')
              sys.exit(1)
          print(d.get('log') or '(no log)')
          if d.get('ok') and status == '200':
              sys.exit(0)
          err = d.get('error') or ''
          detail = d.get('detail') or ''
          msg = ' '.join(p for p in (err, detail) if p).strip() or f'HTTP {status}'
          # Multi-program tenants refuse a blank event_type. A dry run that
          # hits that is a missing input, not a crash — skip so merge-adjacent
          # dispatches don't page. apply=true still fails so we never write
          # an unpinned link.
          if 'no --event-type given' in detail and apply not in ('true', '1', 'yes', 'on'):
              print(f'::warning::{msg}')
              print('Dry-run skipped — re-dispatch with event_type set to the program(s), one per line.')
              sys.exit(0)
          print(f'::error::{msg}')
          sys.exit(1)
          "
