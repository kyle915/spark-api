name: Setup Feel Free check-in

# Seeds Feel Free standing check-in (FF-YMMK3Q left alone) and optionally
# market storage-unit addresses for payable-mileage capture.
# See recaps/management/commands/setup_feel_free_checkin.py.
#
# Prefer code_only=true when only seeding storage / preserving the link.
# RUN apply=false FIRST AND READ THE LOG.

on:
  workflow_dispatch:
    inputs:
      tenant:
        description: "Tenant name/slug substring"
        required: false
        default: "feel free"
      apply:
        description: "Actually write (read the dry run first)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      code_only:
        description: "Leave templates untouched (code + storage seed only)"
        required: false
        default: "true"
        type: choice
        options: ["false", "true"]
      seed_storage_units:
        description: "Write/rewrite Feel Free market storage units"
        required: false
        default: "true"
        type: choice
        options: ["false", "true"]

jobs:
  setup-feel-free-checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fire setup-feel-free-checkin cron endpoint
        env:
          CRON_URL: https://spark-api-new-490085168610.us-central1.run.app/internal/cron/setup-feel-free-checkin
          CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
          TENANT: ${{ github.event.inputs.tenant }}
          APPLY: ${{ github.event.inputs.apply }}
          CODE_ONLY: ${{ github.event.inputs.code_only }}
          SEED_STORAGE: ${{ github.event.inputs.seed_storage_units }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::INTERNAL_CRON_SECRET is not set in repo secrets."
            exit 1
          fi
          STATUS=$(curl -sS -o /tmp/cron-response.json -w '%{http_code}' \
            -X POST "$CRON_URL" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            --data-urlencode "tenant=$TENANT" \
            --data-urlencode "apply=$APPLY" \
            --data-urlencode "code_only=$CODE_ONLY" \
            --data-urlencode "seed_storage_units=$SEED_STORAGE" \
            --max-time 540)
          echo "HTTP $STATUS"
          cat /tmp/cron-response.json
          echo ""
          [ "$STATUS" != "200" ] && exit 1 || exit 0
