name: Audit number fixes (read-only)

# Manually fires `/internal/cron/audit-number-fixes` on Cloud Run — READ-ONLY.
# Per brand, what the recap "number fixes" move:
#   1. approved-only: campaign reports (+ share link / PDF) and the client
#      Home tiles stop counting needs-review and archived recaps;
#   2. give-away wording ("how many cans did you give away?", "Cans sampled")
#      no longer counts as sold;
#   3. one number reader: answers like "1,234", "~30", "20-30" that the old
#      readers read differently.
# The "before" rules are reproduced inside the audit, so it reads the same
# before or after the fix is deployed.
#
# Field names, counts and short numeric answers only — no ambassador or
# consumer names. Only the summary prints in the log; the JSON goes to a
# short-retention artifact (`gh run download <run-id>`).
# Secret-gated via X-Cron-Secret (header, never in the URL).
# Endpoint code ships from develop; this YAML lives on main so it can dispatch.

on:
  workflow_dispatch:
    inputs:
      tenant_id:
        description: "Tenant id (blank = every tenant)"
        required: false
        type: string
      no_reports:
        description: "Skip rebuilding every campaign report (faster)"
        required: false
        type: boolean
        default: false

jobs:
  audit-number-fixes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fire audit-number-fixes cron endpoint
        env:
          CRON_URL: https://spark-api-new-490085168610.us-central1.run.app/internal/cron/audit-number-fixes
          CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
          TENANT_ID: ${{ github.event.inputs.tenant_id }}
          NO_REPORTS: ${{ github.event.inputs.no_reports }}
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::INTERNAL_CRON_SECRET is not set in repo secrets."
            exit 1
          fi
          STATUS=$(curl -sS --max-time 900 -o response.json -w '%{http_code}' \
            -X POST "$CRON_URL" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            --data-urlencode "tenant_id=$TENANT_ID" \
            --data-urlencode "no_reports=$NO_REPORTS")
          echo "HTTP $STATUS"
          python3 -c "import json; d=json.load(open('response.json')); print(d.get('report') or d)" || head -c 2000 response.json
          [ "$STATUS" = "200" ] || exit 1

      - name: Upload response JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: number-fixes-audit
          path: response.json
          retention-days: 3
