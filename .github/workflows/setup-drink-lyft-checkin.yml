name: Setup LYT check-in

# Creates the LYT tenant if missing (slug drink-lyft), copies the six
# storefront 12-pack SKUs and images into the Product catalog, seeds
# "LYT-Event Activation" (Liquid Death Event recap shape), and mints the
# standing LYT- check-in code.
# Idempotent — never remints an existing code. Recaps stay human-reviewed.
#
# RUN apply=false FIRST AND READ THE LOG.
# GitHub only dispatches workflows that live on the default branch (main).

on:
  workflow_dispatch:
    inputs:
      tenant:
        description: "Exact tenant slug or request_url_name"
        required: false
        default: "drink-lyft"
      prefix:
        description: "Brand prefix for a NEW code. Blank = LYT-"
        required: false
        default: ""
      apply:
        description: "Actually write (read the dry run first)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  setup-drink-lyft-checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Fire setup endpoint
        env:
          CRON_URL: https://spark-api-new-490085168610.us-central1.run.app/internal/cron/setup-drink-lyft-checkin
          CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
          TENANT: ${{ github.event.inputs.tenant }}
          PREFIX: ${{ github.event.inputs.prefix }}
          APPLY: ${{ github.event.inputs.apply }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::INTERNAL_CRON_SECRET is not set in repo secrets."
            exit 1
          fi
          STATUS=$(curl -sS -o /tmp/cron-response.json -w '%{http_code}' \
            -X POST "$CRON_URL" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            --data-urlencode "tenant=$TENANT" \
            --data-urlencode "prefix=$PREFIX" \
            --data-urlencode "apply=$APPLY")
          echo "HTTP $STATUS"
          cat /tmp/cron-response.json
          echo ""
          [ "$STATUS" != "200" ] && exit 1 || exit 0
