name: Audit request statuses

# Manual: lists every live request with NO status (they never reach
# Approvals) grouped by tenant, plus tenants with no default request/event
# status. apply=true flags each tenant's Pending status as the default when
# it has none and moves today/future no-status requests to Pending. Past and
# undated ones are only listed. Nothing is approved; no emails.
# Inputs reach the script only through env vars.
# See events/management/commands/audit_request_statuses.py.

on:
  workflow_dispatch:
    inputs:
      tenant:
        description: "Tenant slug or request_url_name (blank = all tenants)"
        required: false
        default: ""
      apply:
        description: "Actually write (true) or dry-run (false)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  audit-request-statuses:
    runs-on: ubuntu-latest
    steps:
      - name: Fire audit-request-statuses cron endpoint
        env:
          CRON_URL: https://spark-api-new-490085168610.us-central1.run.app/internal/cron/audit-request-statuses
          CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
          APPLY: ${{ github.event.inputs.apply || 'false' }}
          TENANT: ${{ github.event.inputs.tenant || '' }}
        run: |
          set -euo pipefail

          if [ -z "$CRON_SECRET" ]; then
            echo "::error::INTERNAL_CRON_SECRET is not set in repo secrets."
            exit 1
          fi

          STATUS=$(curl -sS -o /tmp/cron-response.json -w '%{http_code}' \
            --max-time 600 \
            -X POST "$CRON_URL" \
            --data-urlencode "apply=$APPLY" \
            --data-urlencode "tenant=$TENANT" \
            -H "X-Cron-Secret: $CRON_SECRET")

          echo "HTTP $STATUS"
          python3 -c 'import json; d=json.load(open("/tmp/cron-response.json")); print(d.get("log") or d); print(d.get("detail") or "")'
          if [ "$STATUS" != "200" ]; then
            echo "::error::Cron endpoint returned $STATUS — see body above."
            exit 1
          fi
