name: No-show backup cascade

# Fires `/internal/cron/noshow-cascade` on Cloud Run every 15 min.
# Detects shifts unconfirmed near start or missing check-in 15+ minutes past
# start, creates NoShowCascadeAlert rows, and dispatches fail-open backup
# alerts to ranked BAs + ops. See staffing/cascade.py.
#
# Secret-gated via `X-Cron-Secret` (shared INTERNAL_CRON_SECRET).

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      checkin_grace_minutes:
        description: "Flag missing check-in once the shift started this many minutes ago"
        required: false
        default: "15"
      unconfirmed_lead_minutes:
        description: "Flag unconfirmed shifts starting within this many minutes"
        required: false
        default: "120"
      lookback_hours:
        description: "Ignore shifts that started more than this many hours ago"
        required: false
        default: "6"
      dry_run:
        description: "Evaluate without creating alerts or sending notifications"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  fire-noshow-cascade:
    runs-on: ubuntu-latest
    steps:
      - name: Fire no-show cascade cron endpoint
        env:
          CRON_URL: https://spark-api-new-490085168610.us-central1.run.app/internal/cron/noshow-cascade
          CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
          CHECKIN_GRACE_MINUTES: ${{ github.event.inputs.checkin_grace_minutes || '15' }}
          UNCONFIRMED_LEAD_MINUTES: ${{ github.event.inputs.unconfirmed_lead_minutes || '120' }}
          LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours || '6' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail

          if [ -z "$CRON_SECRET" ]; then
            echo "::error::INTERNAL_CRON_SECRET is not set in repo secrets."
            exit 1
          fi

          STATUS=$(curl -sS -o /tmp/cron-response.json -w '%{http_code}' \
            -X POST "$CRON_URL?checkin_grace_minutes=$CHECKIN_GRACE_MINUTES&unconfirmed_lead_minutes=$UNCONFIRMED_LEAD_MINUTES&lookback_hours=$LOOKBACK_HOURS&dry_run=$DRY_RUN" \
            -H "X-Cron-Secret: $CRON_SECRET")

          echo "HTTP $STATUS"
          cat /tmp/cron-response.json
          if [ "$STATUS" != "200" ]; then
            echo "::error::Cron endpoint returned $STATUS — see body above."
            exit 1
          fi
