name: Look up event map positions
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Look addresses up and print the result, but store nothing"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      tenant:
        description: "Tenant id (blank = all brands)"
        required: false
        default: ""
      limit:
        description: "Most events to look at in one run"
        required: false
        default: "100"
jobs:
  fire-geocode-events:
    runs-on: ubuntu-latest
    steps:
      - name: Fire event geocoding cron endpoint
        env:
          CRON_URL: https://spark-api-new-490085168610.us-central1.run.app/internal/cron/geocode-events
          CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          TENANT: ${{ github.event.inputs.tenant || '' }}
          LIMIT: ${{ github.event.inputs.limit || '100' }}
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::INTERNAL_CRON_SECRET is not set in repo secrets."
            exit 1
          fi
          QUERY="dry_run=$DRY_RUN&limit=$LIMIT"
          if [ -n "$TENANT" ]; then QUERY="$QUERY&tenant=$TENANT"; fi
          STATUS=$(curl -sS --max-time 280 -o /tmp/cron-response.json -w '%{http_code}' -X POST "$CRON_URL?$QUERY" -H "X-Cron-Secret: $CRON_SECRET")
          echo "HTTP $STATUS"
          python3 -c "import json;d=json.load(open('/tmp/cron-response.json'));print(d.get('log') or d)"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Cron endpoint returned $STATUS"
            exit 1
          fi
