name: Incremental tenant → sheet sync

# Watermarked Master-Tracker mirror for every tenant with a linked sheet.
# Prefer this over full backfill on a schedule — fewer 429s / silent gaps.
# Full historical sync remains available via sync_tenant_to_sheet without
# --incremental (and the LD backfill cron).

on:
  schedule:
    - cron: "20 */4 * * *" # every 4 hours at :20 UTC
  workflow_dispatch:
    inputs:
      tenant_slug:
        description: "Tenant slug (blank = every linked tenant)"
        required: false
        default: ""
      dry_run:
        description: "Report only — do not write"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  sync-tenant-to-sheet-incremental:
    runs-on: ubuntu-latest
    steps:
      - name: Fire incremental sheet sync cron endpoint
        env:
          CRON_URL: https://spark-api-new-490085168610.us-central1.run.app/internal/cron/sync-tenant-to-sheet-incremental
          CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
          TENANT_SLUG: ${{ github.event.inputs.tenant_slug || '' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::INTERNAL_CRON_SECRET is not set in repo secrets."
            exit 1
          fi

          STATUS=$(curl -sS -o /tmp/cron-response.json -w '%{http_code}' \
            -X POST "$CRON_URL" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            --data-urlencode "tenant_slug=$TENANT_SLUG" \
            --data-urlencode "dry_run=$DRY_RUN")

          echo "HTTP $STATUS"
          cat /tmp/cron-response.json
          echo ""
          [ "$STATUS" != "200" ] && exit 1 || exit 0
