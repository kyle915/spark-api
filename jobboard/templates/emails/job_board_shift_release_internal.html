<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ subject }}</title>
    <style type="text/css">
      @media only screen and (max-width: 600px) {
        .shell { width: 100% !important; }
        .pad   { padding-left: 24px !important; padding-right: 24px !important; }
        .hero  { font-size: 24px !important; line-height: 28px !important; }
      }
    </style>
  </head>
  <body style="margin:0;padding:0;background:#f4f4f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;color:#0a0d09;">
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background:#f4f4f0;">
      <tr>
        <td align="center" style="padding:24px 12px;">
          <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="600" class="shell"
                 style="width:600px;max-width:600px;background:#ffffff;border-radius:18px;overflow:hidden;box-shadow:0 1px 2px rgba(10,13,9,0.04);">

            <tr>
              <td class="pad" style="padding:24px 40px;background:#0a0d09;border-bottom:3px solid {{ banner_border }};">
                <img src="https://admin.igniteproductions.co/legal/spark-logo-full.png" alt="Spark by Ignite" width="180" height="auto"
                     style="display:block;height:auto;border:0;outline:none;text-decoration:none;" />
              </td>
            </tr>

            <tr>
              <td class="pad" style="padding:32px 40px 8px 40px;">
                <p style="margin:0 0 4px 0;font-family:'Courier New',Courier,monospace;font-size:10px;letter-spacing:0.22em;color:{{ eyebrow_color }};font-weight:700;">
                  {{ eyebrow }}
                </p>
                <h1 class="hero" style="margin:0;font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:28px;line-height:32px;letter-spacing:-0.02em;color:#0a0d09;">
                  {{ headline }}
                </h1>
              </td>
            </tr>

            <tr>
              <td class="pad" style="padding:14px 40px 16px 40px;">
                <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%"
                       style="border-radius:12px;background:{{ banner_bg }};border:1px solid {{ banner_border }};">
                  <tr>
                    <td style="padding:12px 14px;font-size:13px;line-height:19px;color:#0a0d09;">
                      {{ banner_html|safe }}
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <tr>
              <td class="pad" style="padding:0 40px 4px 40px;">
                <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%"
                       style="border:1px solid #eeeae0;border-radius:12px;border-collapse:separate;border-spacing:0;overflow:hidden;">
                  {% for label, value in rows %}
                  <tr>
                    <td style="padding:10px 14px;{% if not forloop.last %}border-bottom:1px solid #eeeae0;{% endif %}font-size:12px;font-weight:700;color:#3b4034;width:130px;vertical-align:top;">{{ label }}</td>
                    <td style="padding:10px 14px;{% if not forloop.last %}border-bottom:1px solid #eeeae0;{% endif %}font-size:13px;color:#0a0d09;white-space:pre-line;">{{ value }}</td>
                  </tr>
                  {% endfor %}
                </table>
              </td>
            </tr>

            <tr>
              <td class="pad" align="left" style="padding:24px 40px 24px 40px;">
                {% if call_href %}
                <a href="{{ call_href }}"
                   style="display:inline-block;padding:12px 22px;background:#ef5a2a;color:#ffffff;text-decoration:none;border-radius:10px;font-weight:700;font-size:14px;margin:0 8px 8px 0;">
                  Call BA
                </a>
                {% endif %}
                {% if request_url %}
                <a href="{{ request_url }}"
                   style="display:inline-block;padding:12px 22px;background:{{ accent }};color:#0a0d09;text-decoration:none;border-radius:10px;font-weight:700;font-size:14px;margin:0 8px 8px 0;">
                  Open request
                </a>
                {% endif %}
                {% if board_url %}
                <a href="{{ board_url }}"
                   style="display:inline-block;padding:12px 22px;background:#ffffff;color:#0a0d09;border:1px solid #0a0d09;text-decoration:none;border-radius:10px;font-weight:700;font-size:14px;margin:0 0 8px 0;">
                  Manage job board
                </a>
                {% endif %}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
